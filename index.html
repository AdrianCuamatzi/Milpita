<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milpa"><meta name="theme-color" content="#2f9e44">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<title>Milpa</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--mu:#6c6c70;--sep:#c6c6c8;--bl:#007aff;--ac:#2f9e44;--gr:#34c759;--or:#ff9500;--rd:#ff3b30;--bar:rgba(249,249,249,.85)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--mu:#8e8e93;--sep:#38383a;--bl:#0a84ff;--ac:#30d158;--gr:#30d158;--or:#ff9f0a;--rd:#ff453a;--bar:rgba(30,30,30,.85)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom))}
h1{font-size:34px;letter-spacing:.3px;margin:14px 16px 12px}
h2{font-size:13px;font-weight:400;color:var(--mu);text-transform:uppercase;margin:0 32px 6px}
.view{display:none}.view.on{display:block;animation:in .45s cubic-bezier(.2,.8,.2,1)}
.view.on.r{animation-name:inR}.view.on.l{animation-name:inL}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@keyframes inR{from{opacity:0;transform:translateX(44px) scale(.98)}}
@keyframes inL{from{opacity:0;transform:translateX(-44px) scale(.98)}}
.grp{background:var(--card);border-radius:16px;margin:0 16px 22px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 20px rgba(0,0,0,.05)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;min-height:44px}
.row+.row{border-top:.5px solid var(--sep)}
.row>:last-child{text-align:right}.row small{color:var(--mu)}
input,select{font:inherit;color:var(--ac);background:none;border:0;text-align:right;text-align-last:right;min-width:0;width:58%;outline:0;-webkit-appearance:none;appearance:none}
.seg{display:flex;background:rgba(118,118,128,.18);border-radius:9px;padding:2px}
.seg button{border:0;background:none;color:var(--tx);font:inherit;font-size:14px;padding:5px 14px;border-radius:7px;transition:.25s}
.seg .on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.btn{display:block;width:calc(100% - 32px);margin:0 16px 22px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#2f9e44,#7bc043);color:#fff;font:inherit;font-weight:600;box-shadow:0 6px 16px rgba(47,158,68,.35);transition:transform .15s}
.btn:active{transform:scale(.97)}
.hero{margin:0 16px 22px;border-radius:22px;padding:18px 18px 0;background:linear-gradient(135deg,#2f9e44,#7bc043 55%,#f5b301);color:#fff;display:flex;justify-content:space-between;align-items:flex-end;box-shadow:0 10px 26px rgba(47,158,68,.3);overflow:hidden;min-height:118px}
.hero b{font-size:22px;line-height:1.15;display:block;margin:2px 0 14px}.hero small{opacity:.9}
.hero svg{width:74px;flex:none}.sway{transform-origin:50% 100%;animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{to{transform:rotate(4deg)}}
.pop{animation:pop .5s cubic-bezier(.2,1.2,.3,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
.bar{height:8px;border-radius:4px;background:rgba(118,118,128,.2);margin:14px 16px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#f5b301);border-radius:4px;animation:gr 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes gr{from{width:0}}
.big{font-size:34px;font-weight:700;padding:4px 16px 12px}
.note{color:var(--mu);font-size:13px;margin:-14px 32px 22px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}
.badge{display:inline-block;color:#fff;font-weight:700;border-radius:20px;padding:6px 16px;margin:14px 16px 4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bar);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:.5px solid var(--sep);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s}
.tab.on{color:var(--ac)}.tab.on svg{transform:scale(1.15) translateY(-1px)}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
iframe{width:100%;height:220px;border:0;display:block}
#map{height:260px}a{color:var(--bl);text-decoration:none}svg.m{display:block;width:100%}
.heat{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;padding:12px;font-size:12px;align-items:center;text-align:center}
.hc{border-radius:8px;padding:10px 0;font-weight:600}.hl{color:var(--mu)}
.draw{stroke-dasharray:1;animation:dr 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.gb{transform-origin:bottom;transform-box:fill-box;animation:gb .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes gb{from{transform:scaleY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<section class="view on" id="v0"><h1>Mi siembra</h1>
<div class="hero pop"><div><small id="hs">Tu cosecha de maíz</small><b id="hh">Captura tu siembra para ver el avance</b></div>
<svg class="sway" viewBox="0 0 64 84"><path d="M32 84V22" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="M32 66C18 62 9 52 6 38c13 3 24 12 26 28z" fill="#c8ecb0"/><path d="M32 56c14-4 23-14 26-28-13 3-24 12-26 28z" fill="#e3f7d5"/><ellipse cx="41" cy="44" rx="7" ry="14" fill="#ffd60a" transform="rotate(14 41 44)"/><path d="M34 36c-2 10 0 20 8 26 4-4 8-8 8-14-5 3-11 0-16-12z" fill="#8ed081"/><path d="M32 22l-9-12M32 22l-3-14M32 22l5-14M32 22l10-11" stroke="#ffe08a" stroke-width="2.5" stroke-linecap="round"/></svg></div>
<h2>Datos del cultivo</h2><div class="grp">
<label class="row"><span>🗓️ Fecha de siembra</span><input id="fecha" type="date"></label>
<label class="row"><span>📐 Hectáreas</span><input id="ha" type="number" inputmode="decimal" step="0.5" min="0" placeholder="0"></label>
<label class="row"><span>📍 Estado</span><select id="estado"><option value="">Cargando…</option></select></label>
<label class="row"><span>🏘️ Municipio</span><select id="mun"><option value="">Elige un estado</option></select></label>
<div class="row"><span>💧 Sistema</span><div class="seg" id="sis"><button data-v="t" class="on">Temporal</button><button data-v="r">Riego</button></div></div>
<label class="row"><span>🌽 Rendimiento (t/ha)</span><input id="rend" type="number" inputmode="decimal" step="0.1" value="3.5"></label>
<label class="row"><span>💲 Precio por tonelada</span><input id="precio" type="number" inputmode="decimal" value="6000"></label>
<label class="row"><span>🧾 Costo por ha (opcional)</span><input id="costo" type="number" inputmode="decimal" value="0"></label>
</div>
<button class="btn" id="go">Calcular</button><div id="out"></div></section>
<section class="view" id="v1"><h1>Clima</h1><div id="cl"></div></section>
<section class="view" id="v2"><h1>Satélite</h1><div id="st"></div></section>
<section class="view" id="v3"><h1>Gráficas</h1><div id="gr"></div></section>
<section class="view" id="v4"><h1>Zona</h1><div id="zn"></div></section>
<nav>
<button class="tab on"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Panel</button>
<button class="tab"><svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 9.5 4.25 4.25 0 0 1 17 18z"/></svg>Clima</button>
<button class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3.5 3 13.5 0 17M12 3.5c-3 3.5-3 13.5 0 17"/></svg>Satélite</button>
<button class="tab"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Gráficas</button>
<button class="tab"><svg viewBox="0 0 24 24"><path d="M3 19l6-10 4 6 2.5-4L21 19z"/></svg>Zona</button>
</nav>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const F=['fecha','ha','estado','mun','rend','precio','costo'],K='milpa:dash',MU='https://raw.githubusercontent.com/cisnerosnow/json-estados-municipios-mexico/master/estados-municipios.json';
let S={},sis='t',ME=null;try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
['fecha','ha','rend','precio','costo'].forEach(f=>{if(S[f]!=null&&S[f]!=='')$('#'+f).value=S[f]});
function setSis(x){sis=x;$$('#sis button').forEach(b=>b.classList.toggle('on',b.dataset.v===x))}
setSis(S.sis||'t');$$('#sis button').forEach(b=>b.onclick=()=>setSis(b.dataset.v));
const v=i=>$('#'+i).value,ld=t=>'<p class="note" style="margin:0 32px 22px">'+t+'</p>';
const n0=x=>Math.round(x).toLocaleString('es-MX'),n1=x=>x.toLocaleString('es-MX',{maximumFractionDigits:1}),mx=x=>x.toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const add=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r},fd=d=>d.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rel=(d,t)=>{const n=Math.round((d-t)/864e5);return n===0?'hoy':n>0?'en '+n+' días':'hace '+(-n)+' días'};
const R=(a,c)=>'<div class="row"><span>'+a+'</span><span>'+c+'</span></div>';
function cu(){$$('.cu').forEach(e=>{const to=+e.dataset.n,m=e.dataset.m,t0=performance.now();const st=t=>{const p=Math.min(1,(t-t0)/900),x=to*(1-Math.pow(1-p,3));e.textContent=m==='$'?mx(x):n1(x);if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
/* Estados y municipios */
function fillMun(sel){const e=v('estado'),m=$('#mun');if(!m||m.tagName!=='SELECT')return;
 m.innerHTML=ME&&ME[e]?'<option value="">Elegir…</option>'+ME[e].map(x=>'<option>'+esc(x)+'</option>').join(''):'<option value="">Elige un estado</option>';if(sel)m.value=sel}
async function loadMun(){
 try{ME=JSON.parse(localStorage.getItem('milpa:mun'))}catch(e){}
 if(!ME||!Object.keys(ME).length){try{ME=await(await fetch(MU)).json();try{localStorage.setItem('milpa:mun',JSON.stringify(ME))}catch(e){}}catch(e){ME=null}}
 const se=$('#estado');
 if(!ME){['estado','mun'].forEach(id=>{const i=document.createElement('input');i.id=id;i.placeholder=id==='estado'?'Estado':'Municipio';i.value=S[id]||'';$('#'+id).replaceWith(i)});return}
 se.innerHTML='<option value="">Elegir…</option>'+Object.keys(ME).map(k=>'<option>'+esc(k)+'</option>').join('');
 if(S.estado&&ME[S.estado]){se.value=S.estado;fillMun(S.mun)}
 se.onchange=()=>{fillMun();G=null}
 $('#mun').onchange=()=>{G=null}
}
function calc(){
 S={};F.forEach(f=>S[f]=v(f));S.sis=sis;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
 const out=$('#out'),ha=parseFloat(v('ha'));
 if(!v('fecha')||!(ha>0)){out.innerHTML=ld('Captura la fecha de siembra y las hectáreas.');return}
 const s0=new Date(v('fecha')+'T12:00:00'),hoy=new Date(),dd=Math.round((hoy-s0)/864e5);
 const ev=[['🌱 Siembra y 1.ª fertilización',0,'var(--ac)'],['🧪 2.ª fertilización',35,'var(--or)'],['🌽 Elote tierno',100,'var(--gr)'],['🌾 Madurez fisiológica',150,'var(--or)'],['🚜 Seco, listo para trilladora',180,'var(--rd)']];
 const sig=ev.find(e=>add(s0,e[1])>=hoy);
 $('#hs').textContent=dd<0?'Aún no se siembra':'Día '+dd+' del ciclo';
 $('#hh').textContent=sig?sig[0].slice(3)+' '+rel(add(s0,sig[1]),hoy):'Ciclo completo: listo para cosechar';
 const pct=Math.max(0,Math.min(100,dd/180*100));
 const D=sis==='t'?[120,60,30]:[160,80,40];
 const dap=D[1]*ha/.46,urea=(D[0]*ha-dap*.18)/.46,kcl=D[2]*ha/.6;
 const b=x=>n0(x)+' kg<br><small>'+Math.ceil(x/50)+' bultos de 50 kg</small>';
 const ton=parseFloat(v('rend')||0)*ha,ing=ton*parseFloat(v('precio')||0),cos=parseFloat(v('costo')||0)*ha,gan=ing-cos;
 const q=encodeURIComponent(v('mun')+', '+v('estado')+', México');
 out.innerHTML=
 '<h2>Calendario aproximado</h2><div class="grp pop" style="--i:0">'+ev.map(e=>{const d=add(s0,e[1]);return R('<i class="dot" style="background:'+e[2]+'"></i>'+e[0],fd(d)+'<br><small>'+rel(d,hoy)+'</small>')}).join('')+'<div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
 '<p class="note">Plazos típicos de valles altos; cambian con la variedad y el clima.</p>'+
 '<h2>Fertilizante para '+n1(ha)+' ha</h2><div class="grp pop" style="--i:1">'+R('🧪 Siembra · DAP 18-46-00',b(dap))+R('🧂 Siembra · Cloruro de potasio',b(kcl))+R('🌿 Siembra · Urea (1/3)',b(urea/3))+R('🌿 A los 35 días · Urea (2/3)',b(urea*2/3))+'</div>'+
 '<p class="note">Dosis de referencia N-P₂O₅-K₂O: '+D.join('-')+' kg/ha. Un análisis de suelo la afina.</p>'+
 '<h2>Producción y ganancia</h2><div class="grp pop" style="--i:2">'+R('⚖️ Producción estimada',n1(ton)+' toneladas')+R('💰 Ingreso por venta',mx(ing))+R('🧾 Costos',mx(cos))+R('📈 Ganancia aproximada','')+'<div class="big" style="color:var(--'+(gan>=0?'gr':'rd')+')"><span class="cu" data-m="$" data-n="'+gan+'">0</span></div></div>'+
 (v('mun')&&v('estado')?'<h2>Ubicación</h2><div class="grp pop" style="--i:3"><iframe loading="lazy" title="Mapa" src="https://www.google.com/maps?q='+q+'&output=embed"></iframe><div class="row"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+q+'">Abrir en Google Maps</a></div></div>':'');
 cu();
}
$('#go').onclick=calc;
/* Ubicación: Nominatim (OpenStreetMap) para el municipio y Open-Meteo para clima y elevación */
let G=null,Gk='';
async function getGeo(){
 const es=v('estado').trim(),mu=v('mun').trim();
 if(!es||!mu)throw new Error('Elige estado y municipio en la pestaña Panel.');
 if(G&&Gk===es+'|'+mu)return G;
 const r=(await(await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=mx&polygon_geojson=1&polygon_threshold=0.003&accept-language=es&q='+encodeURIComponent(mu+', '+es+', México'))).json())[0];
 if(!r)throw new Error('No encontré "'+mu+'" en el mapa. Prueba con otro municipio cercano.');
 const lat=+r.lat,lon=+r.lon,w=await(await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&past_days=14&forecast_days=16&timezone=auto')).json();
 if(w.error||!w.daily)throw new Error('El servicio del clima no respondió. Intenta de nuevo.');
 Gk=es+'|'+mu;return G={r,lat,lon,w,name:mu+', '+es};
}
let LP=null,LM=null;
function loadLeaflet(){return LP||(LP=new Promise((ok,no)=>{if(window.L)return ok();const l=document.createElement('link');l.rel='stylesheet';l.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(l);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';s.onload=ok;s.onerror=()=>{LP=null;no(new Error('No se pudo cargar el mapa'))};document.head.appendChild(s)}))}
function mapa(g){
 if(LM){LM.remove();LM=null}
 LM=L.map('map',{zoomControl:false}).setView([g.lat,g.lon],11);
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Esri, Maxar'}).addTo(LM);
 const gj=g.r.geojson;
 if(gj&&/Polygon/.test(gj.type)){const p=L.geoJSON(gj,{style:{color:'#f5b301',weight:3,fillOpacity:.12}}).addTo(LM);LM.fitBounds(p.getBounds().pad(.1))}
 else L.circleMarker([g.lat,g.lon],{radius:9,color:'#fff',fillColor:'#f5b301',fillOpacity:1}).addTo(LM);
}
async function clima(){
 const el=$('#cl');el.innerHTML=ld('Buscando tu municipio…');
 try{const g=await getGeo(),d=g.w.daily,sm=a=>a.reduce((s,x)=>s+(x||0),0);
  const pas=sm(d.precipitation_sum.slice(0,14)),fut=sm(d.precipitation_sum.slice(14));
  const tx=Math.max(...d.temperature_2m_max.slice(14)),tn=Math.min(...d.temperature_2m_min.slice(14));
  const mes=new Date().getMonth()+1,ll=mes>=5&&mes<=9;let e,c,t;
  if(tn<=0){e='Riesgo';c='var(--rd)';t='Se esperan heladas. El maíz joven o en llenado de grano puede dañarse.'}
  else if(tx>=34){e='Riesgo';c='var(--rd)';t='Se esperan días de calor extremo que pueden estresar la planta.'}
  else if(ll&&pas+fut<40){e='Riesgo';c='var(--rd)';t='Ha llovido y se espera poco: hay riesgo de sequía en plena temporada.'}
  else if(pas+fut>250){e='Regular';c='var(--or)';t='Lluvia abundante: vigila encharcamientos y enfermedades.'}
  else{e='Favorable';c='var(--gr)';t='Sin señales de helada, calor extremo ni sequía en este periodo.'}
  el.innerHTML='<h2>'+esc(g.name)+'</h2><div class="grp pop" style="--i:0"><div id="map"></div></div><div class="grp pop" style="--i:1"><span class="badge" style="background:'+c+'">'+e+'</span><p style="margin:4px 16px 14px">'+t+'</p>'+
  R('🌧️ Lluvia, últimos 14 días',n0(pas)+' mm')+R('☔ Lluvia, próximos 16 días',n0(fut)+' mm')+R('🌡️ Máxima esperada',n0(tx)+' °C')+R('🥶 Mínima esperada',n0(tn)+' °C')+'</div>'+
  '<p class="note">Es un panorama de 30 días, no un pronóstico de toda la temporada, y no anticipa granizo. Avisos oficiales: <a target="_blank" rel="noopener" href="https://smn.conagua.gob.mx">smn.conagua.gob.mx</a>.</p>';
  try{await loadLeaflet();mapa(g)}catch(x){$('#map').innerHTML=ld(x.message)}
 }catch(x){el.innerHTML=ld(esc(x.message))}
}
/* Satélite del SMN por sector */
const SEC={'Ciudad de México':'Valle de México','México':'Valle de México','Puebla':'Centro de México','Tlaxcala':'Centro de México','Hidalgo':'Centro de México','Morelos':'Centro de México','Querétaro':'Centro de México','Guanajuato':'Centro Occidente','Jalisco':'Centro Occidente','Colima':'Centro Occidente','Michoacán de Ocampo':'Centro Occidente','Nayarit':'Centro Occidente','Aguascalientes':'Centro Occidente','Zacatecas':'Centro Occidente','San Luis Potosí':'Centro Occidente','Yucatán':'Península de Yucatán','Quintana Roo':'Península de Yucatán','Campeche':'Península de Yucatán','Chiapas':'Frontera Sur','Tabasco':'Frontera Sur','Oaxaca':'Pacífico - Sur','Guerrero':'Pacífico - Sur','Veracruz de Ignacio de la Llave':'Golfo de México','Baja California':'Noroeste de México','Baja California Sur':'Noroeste de México','Sonora':'Noroeste de México','Sinaloa':'Noroeste de México','Chihuahua':'Noroeste de México','Durango':'Noroeste de México','Coahuila de Zaragoza':'Noreste de México','Nuevo León':'Noreste de México','Tamaulipas':'Noreste de México'};
function sat(){
 const es=v('estado'),sec=SEC[es]||'México',u='https://smn.conagua.gob.mx/tools/GUI/Visor_satelite.php?id=1&panelEncabezado=0&panelHusosHorarios=0&satelite=GOES+Este&nombre='+encodeURIComponent(sec)+'&tipo=Infrarrojo';
 $('#st').innerHTML='<h2>'+(es?esc(es)+' · ':'')+'Sector '+esc(sec)+'</h2><div class="grp pop" style="--i:0"><iframe style="height:430px" title="Imagen de satélite del SMN" src="'+esc(u)+'"></iframe>'+
 '<div class="row"><a target="_blank" rel="noopener" href="'+esc(u)+'">Abrir visor del SMN</a></div><div class="row"><a target="_blank" rel="noopener" href="https://smn.conagua.gob.mx/es/observando-el-tiempo/imagenes-de-satelite">Todos los sectores del SMN</a></div></div>'+
 '<p class="note">Imágenes del satélite GOES del Servicio Meteorológico Nacional. El SMN publica por sectores, no por estado; aquí se elige el que cubre el tuyo'+(es?'':' (elige un estado en Panel)')+'. Si el visor no carga dentro de la app, usa los enlaces.</p>';
}
/* Gráficas */
function lc(xs,ys,cx,cy,fx,col){
 const W=340,H=180,x0=xs[0],x1=xs[xs.length-1],y0=Math.min(0,...ys),y1=Math.max(0,...ys),X=a=>44+(a-x0)/(x1-x0)*(W-56),Y=a=>H-28-(a-y0)/((y1-y0)||1)*(H-46);
 const pts=xs.map((x,i)=>X(x).toFixed(1)+','+Y(ys[i]).toFixed(1)).join(' '),k=a=>(a/1000).toFixed(0)+'k',tx=(x,a,t)=>'<text x="'+x+'" y="'+(H-8)+'" font-size="10" fill="var(--mu)" text-anchor="'+a+'">'+t+'</text>';
 return '<svg class="m" viewBox="0 0 '+W+' '+H+'"><line x1="44" x2="'+(W-12)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--sep)" stroke-dasharray="3 3"/><polygon points="'+X(x0)+','+Y(0)+' '+pts+' '+X(x1)+','+Y(0)+'" fill="'+col+'" opacity=".16"/><polyline class="draw" pathLength="1" points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+X(cx)+'" cy="'+Y(cy)+'" r="6" fill="'+col+'" stroke="var(--card)" stroke-width="2.5"/>'+
 '<text x="4" y="'+(Y(y1)+4)+'" font-size="10" fill="var(--mu)">$'+k(y1)+'</text>'+(y0<0?'<text x="4" y="'+(Y(y0)+4)+'" font-size="10" fill="var(--mu)">$'+k(y0)+'</text>':'')+
 tx(X(x0),'start',fx(x0))+tx(X((x0+x1)/2),'middle',fx((x0+x1)/2))+tx(X(x1),'end',fx(x1))+'</svg>';
}
function rc(d){
 const pr=d.precipitation_sum,mv=Math.max(...pr,1),n=pr.length,bw=300/n;
 return '<svg class="m" viewBox="0 0 340 160"><line x1="'+(20+14*bw-1)+'" x2="'+(20+14*bw-1)+'" y1="10" y2="132" stroke="var(--mu)" stroke-dasharray="3 3"/>'+
 pr.map((x,i)=>'<rect class="gb" style="animation-delay:'+i*20+'ms" x="'+(20+i*bw)+'" y="'+(132-x/mv*110)+'" width="'+(bw-2)+'" height="'+Math.max(1,x/mv*110)+'" rx="2" fill="'+(i<14?'#64b5f6':'#007aff')+'"/>').join('')+
 '<text x="20" y="152" font-size="10" fill="var(--mu)">'+esc(d.time[0].slice(5))+'</text><text x="'+(20+14*bw)+'" y="152" font-size="10" fill="var(--mu)" text-anchor="middle">hoy</text><text x="320" y="152" font-size="10" fill="var(--mu)" text-anchor="end">'+esc(d.time[n-1].slice(5))+'</text><text x="20" y="9" font-size="10" fill="var(--mu)">máx. '+n1(mv)+' mm</text></svg>';
}
async function graf(){
 const el=$('#gr'),ha=parseFloat(v('ha')),r=parseFloat(v('rend')),p=parseFloat(v('precio')),c=parseFloat(v('costo')||0);
 if(!(ha>0)||!(r>0)||!(p>0)){el.innerHTML=ld('Captura hectáreas, rendimiento y precio en la pestaña Panel.');return}
 const Gn=(y,q)=>y*ha*q-c*ha,ing=r*ha*p,cos=c*ha,gan=ing-cos,mv=Math.max(ing,cos,Math.abs(gan),1);
 const Bx=(n,val,col)=>'<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>'+n+'</span><b>'+mx(val)+'</b></div><div class="bar" style="margin:8px 0 0"><i style="width:'+Math.abs(val)/mv*100+'%;background:'+col+'"></i></div></div>';
 const ys=[.4,.7,1,1.3,1.6].map(k=>r*k),ps=[.6,.8,1,1.2,1.4].map(k=>p*k),mm=Math.max(...ys.flatMap(y=>ps.map(q=>Math.abs(Gn(y,q)))),1);
 const cell=(g,cur)=>'<div class="hc" style="background:rgba('+(g>=0?'52,199,89':'255,59,48')+','+(.15+.7*Math.abs(g)/mm)+')'+(cur?';outline:2px solid var(--tx)':'')+'">'+(g/1000).toFixed(0)+'k</div>';
 const heat='<div class="heat"><span></span>'+ps.map(q=>'<span class="hl">$'+(q/1000).toFixed(1)+'k</span>').join('')+ys.map((y,i)=>'<span class="hl">'+n1(y)+' t</span>'+ps.map((q,j)=>cell(Gn(y,q),i===2&&j===2)).join('')).join('')+'</div>';
 const xs1=[...Array(9)].map((_,i)=>r*(.2+i*.2)),xs2=[...Array(9)].map((_,i)=>p*(.5+i*.125));
 const be=cos>0?Math.min(1,1):0;
 el.innerHTML='<h2>Ingresos, costos y ganancia</h2><div class="grp pop" style="--i:0">'+Bx('💰 Ingreso',ing,'var(--ac)')+Bx('🧾 Costos',cos,'var(--or)')+Bx('📈 Ganancia',gan,gan>=0?'var(--gr)':'var(--rd)')+
 R('⚖️ Rendimiento de equilibrio',n1(cos/ha/p)+' t/ha')+R('🏷️ Precio de equilibrio',mx(c/r)+' /t')+'</div>'+
 '<h2>Ganancia según rendimiento y precio (miles $)</h2><div class="grp pop" style="--i:1">'+heat+'</div><p class="note">El recuadro marcado es tu escenario. Filas: toneladas por hectárea; columnas: precio por tonelada.</p>'+
 '<h2>Ganancia vs. rendimiento (t/ha)</h2><div class="grp pop" style="--i:2">'+lc(xs1,xs1.map(y=>Gn(y,p)),r,gan,x=>n1(x),'#2f9e44')+'</div>'+
 '<h2>Ganancia vs. precio por tonelada</h2><div class="grp pop" style="--i:3">'+lc(xs2,xs2.map(q=>Gn(r,q)),p,gan,x=>'$'+(x/1000).toFixed(1)+'k','#ff9500')+'</div><div id="rl"></div>';
 try{const g=await getGeo();$('#rl').innerHTML='<h2>Lluvia diaria, 14 días pasados y 16 próximos</h2><div class="grp pop" style="--i:4">'+rc(g.w.daily)+'</div><p class="note">Azul claro: lluvia registrada. Azul fuerte: pronóstico.</p>'}catch(x){$('#rl').innerHTML=ld('Lluvia diaria: '+esc(x.message))}
}
/* Zona */
function mont(h){
 const y=a=>190-Math.max(0,a)/5600*170,yt=y(h),yp=y(5400);
 return '<svg class="m" viewBox="0 0 360 200" role="img" aria-label="Tu terreno comparado con el Popocatépetl"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ac8fa"/><stop offset="1" stop-color="#e3f4ff"/></linearGradient></defs><rect width="360" height="200" fill="url(#sk)"/>'+
 '<path d="M0 200V'+(yt+6)+'Q50 '+(yt-4)+' 105 '+(yt+2)+'L175 '+(yt-30)+'L228 '+(yp+22)+'L246 '+yp+'L264 '+(yp+10)+'L312 '+(yt-25)+'L360 '+(yt-4)+'V200Z" fill="#8e8e93"/>'+
 '<path d="M228 '+(yp+22)+'L246 '+yp+'L264 '+(yp+10)+'L252 '+(yp+18)+'L243 '+(yp+12)+'L235 '+(yp+20)+'Z" fill="#fff"/>'+
 '<line x1="246" y1="'+yp+'" x2="246" y2="'+yt+'" stroke="#ff3b30" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="60" y1="'+yt+'" x2="246" y2="'+yt+'" stroke="#ff9500" stroke-width="1.5" stroke-dasharray="3 3"/>'+
 '<circle cx="60" cy="'+yt+'" r="6" fill="#ff9500" stroke="#fff" stroke-width="2"/>'+
 '<text x="12" y="'+(yt-14)+'" font-size="11" font-weight="700" fill="#000">Tu zona · '+n0(h)+' m</text><text x="352" y="'+(yp-6)+'" text-anchor="end" font-size="11" font-weight="700" fill="#000">Popocatépetl · ≈5,400 m</text></svg>';
}
async function zona(){
 const el=$('#zn');el.innerHTML=ld('Buscando tu zona…');
 const L=(t,a)=>'<h2>'+t+'</h2><div class="grp pop" style="--i:1">'+a.map(x=>'<div class="row"><span style="text-align:left">'+x+'</span></div>').join('')+'</div>';
 try{const g=await getGeo(),h=g.w.elevation;
  el.innerHTML='<h2>'+esc(g.name)+'</h2><div class="grp pop" style="--i:0">'+mont(h)+R('🌋 El volcán se eleva','≈'+n0(5400-h)+' m más que tu zona')+'</div>'+
  '<p class="note">Altura del modelo de terreno en las coordenadas del municipio; tu parcela puede variar. La altura del volcán cambia según la fuente.</p>'+
  L('🪨 Suelo (referencia del Altiplano central)',['Predominan suelos de origen volcánico: feozem, cambisol, regosol y, en laderas, andosol.','Es común el tepetate, una capa endurecida que frena raíces y retiene poca agua.'])+
  L('🐿️ Fauna que puede afectar el cultivo',['Tuza, conejo, ardilla, tlacuache y coyote.','Cuervo, paloma y zanate, que dañan semilla y elote.'])+
  L('🐛 Plagas y enfermedades comunes',['Gusano cogollero, gallina ciega, gusano elotero y gusano trozador.','Tuza en raíces. Tizón foliar, roya, carbón y pudrición de mazorca.'])+
  '<p class="note">Suelo, fauna y plagas son referencias generales de la región, no mediciones de tu parcela.</p>';
 }catch(x){el.innerHTML=ld(esc(x.message))}
}
